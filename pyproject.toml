[project]
name = "olist-customer-analytics"
version = "1.0.0"
description = "Customer LTV, cohort retention, RFM segmentation and repeat-purchase prediction on 100K real e-commerce orders, with a Streamlit dashboard."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.64.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
]
